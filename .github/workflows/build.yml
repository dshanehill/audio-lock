name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash build.sh
      - name: Zip app
        run: |
          cd build && ditto -c -k --keepParent "Audio Lock.app" AudioLock.zip
          cp AppIcon.iconset/icon_512x512.png AppIcon.png
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: Audio Lock 1.1
          files: |
            build/AudioLock.zip
            build/AppIcon.png
          make_latest: true
